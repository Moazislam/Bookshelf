[package]
name = "bookshelf"
version = "0.3.0"
description = "BookShelf — a local-first personal digital library"
authors = ["BookShelf"]
edition = "2024"

[lib]
name = "bookshelf_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
# Rust-side only: reads/writes Android content:// URIs. No fs permissions are granted to the UI.
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled", "serde_json", "backup"] }
blake3 = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
quick-xml = "0.37"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp"] }
walkdir = "2"
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
percent-encoding = "2"
log = "0.4"

# Desktop only: Android/iOS have no recycle bin or window state to restore.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
trash = "5"
tauri-plugin-window-state = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
