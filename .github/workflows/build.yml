name: Build

# Builds installers for Windows, macOS and Linux.
# - Every push to main / pull request: runs checks and uploads installers as workflow artifacts.
# - Pushing a tag like v0.2.0: also creates a draft GitHub Release with all installers attached.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Type-check & tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - name: Rust tests
        working-directory: src-tauri
        run: cargo test

  build:
    name: Build (${{ matrix.name }})
    needs: check
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            platform: windows-latest
            args: "--bundles nsis"
            rust_targets: ""
          - name: macOS (Apple Silicon)
            platform: macos-latest
            args: "--target aarch64-apple-darwin --bundles app,dmg"
            rust_targets: aarch64-apple-darwin
          - name: macOS (Intel)
            platform: macos-latest
            args: "--target x86_64-apple-darwin --bundles app,dmg"
            rust_targets: x86_64-apple-darwin
          - name: Linux
            platform: ubuntu-22.04
            args: "--bundles deb,appimage,rpm"
            rust_targets: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          key: ${{ matrix.rust_targets }}

      - run: pnpm install --frozen-lockfile

      - name: Build installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}
          # Only create a (draft) release when building a version tag.
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/v') && format('BookShelf {0}', github.ref_name) || '' }}
          releaseBody: "Download the installer for your system below. See the README for first-launch notes on unsigned builds."
          releaseDraft: true
          prerelease: false

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: BookShelf-${{ matrix.name }}
          if-no-files-found: error
          path: |
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/deb/*.deb
            src-tauri/target/**/release/bundle/appimage/*.AppImage
            src-tauri/target/**/release/bundle/rpm/*.rpm

  android:
    name: Build (Android)
    # Runs after the desktop builds so the draft release for a tag already exists.
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    env:
      # Optional signing secrets. Without them CI makes a debug-signed APK (fine for testing, not for the Play Store).
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          key: android
      - run: pnpm install --frozen-lockfile

      - name: Generate the Android project if it isn't committed
        run: |
          echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          [ -d src-tauri/gen/android ] || NDK_HOME=$ANDROID_NDK_LATEST_HOME pnpm tauri android init --ci

      - name: Build APK (64-bit ARM, i.e. practically every phone from the last ~8 years)
        run: |
          if [ "$HAS_KEYSTORE" = "true" ]; then
            pnpm tauri android build --apk --target aarch64
          else
            pnpm tauri android build --apk --target aarch64 --debug
          fi

      - name: Sign release APK
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          UNSIGNED=$(find src-tauri/gen/android/app/build/outputs/apk -name '*release-unsigned.apk' | head -1)
          "$BT/zipalign" -f -p 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-pass env:KEYSTORE_PASSWORD \
            --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASSWORD \
            --out "$RUNNER_TEMP/BookShelf.apk" "$RUNNER_TEMP/aligned.apk"
          rm "$RUNNER_TEMP/release.jks"

      - name: Collect APK
        run: |
          mkdir -p dist-android
          if [ "$HAS_KEYSTORE" = "true" ]; then
            cp "$RUNNER_TEMP/BookShelf.apk" "dist-android/BookShelf_${GITHUB_REF_NAME//\//-}_android.apk"
          else
            cp "$(find src-tauri/gen/android/app/build/outputs/apk -name '*debug.apk' | head -1)" "dist-android/BookShelf_${GITHUB_REF_NAME//\//-}_android-debug.apk"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: BookShelf-Android
          if-no-files-found: error
          path: dist-android/*.apk

      - name: Attach to the draft release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" dist-android/*.apk --clobber
